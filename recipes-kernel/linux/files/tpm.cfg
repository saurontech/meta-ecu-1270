# ECU-1270 (TI J722S): Infineon SLB9673 TPM 2.0 on main_i2c3 @ 0x2e.
# TCG PC Client PTP I2C interface -> drivers/char/tpm/tpm_tis_i2c.c
# Board hardware enablement, NOT a feature toggle (plan 5.1).

# Prerequisite. TCG_TIS_I2C lives inside "if TCG_TPM ... endif" in
# drivers/char/tpm/Kconfig, so if TCG_TPM is ever dropped from TI's defconfig
# the next line is SILENTLY discarded. Defensive; TI already ships =y.
CONFIG_TCG_TPM=y

# The driver we need.
CONFIG_TCG_TIS_I2C=y
# (Kconfig selects TCG_TIS_CORE and CRC_CCITT; both are =m today -> promoted to y.)

# The WRONG driver, enabled by default in TI's defconfig: tpm_i2c_infineon.c is
# TPM 1.2 and its of_match_table only knows slb9635tt/slb9645tt. It will never
# bind "infineon,slb9673".
# CONFIG_TCG_TIS_I2C_INFINEON is not set

# NOT needed: encrypts only TPM traffic originated BY THE KERNEL. We go through
# userspace /dev/tpmrm0 (plan 8.4, R7).
# CONFIG_TCG_TPM2_HMAC=y
