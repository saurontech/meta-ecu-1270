# overlayfs.cfg — overlay root for ECU-1270.
#
# The ONE real change: the TI defconfig ships CONFIG_OVERLAY_FS=m and the
# initramfs carries no module tree, so force it built-in.
CONFIG_OVERLAY_FS=y

# Already =y in the TI defconfig. Pinned so a defconfig bump cannot silently
# drop what the initramfs depends on.
CONFIG_BLK_DEV_INITRD=y
CONFIG_RD_GZIP=y
CONFIG_DEVTMPFS=y
CONFIG_TMPFS=y
