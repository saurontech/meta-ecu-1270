# Installed as rauc-setup-env.service.d/10-luks-data.conf
# ONLY when LUKS_DATA_ENABLED=1 AND RAUC_ENABLED=1 AND LUKS_DATA_MOUNT=/data.
# Requires= (not just After=) so a failed unlock shows up as
# "Dependency failed for rauc-setup-env.service" instead of a confusing
# "unknown filesystem type" from mount -t ext4 on a LUKS container.
[Unit]
Requires=ecu1270-luks-data.service
After=ecu1270-luks-data.service