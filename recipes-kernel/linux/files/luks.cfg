# ECU-1270 LUKS/dm-crypt kernel capability, same as rauc.cfg's CONFIG_DM_VERITY:
# a kernel capability, not a feature (LUKS_DATA_ENABLED decides that; plan 5.1).
#
# MD and BLK_DEV_DM are pinned here, not left to rauc.cfg: DM_CRYPT lives inside
# "if MD ... endif" in drivers/md/Kconfig (same silent-drop risk as tpm.cfg's
# TCG_TPM prerequisite). rauc.cfg sets BLK_DEV_DM=y but never MD=y -- that only
# works today because TI's defconfig ships MD=y by default.
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_CRYPT=y

# aes-xts-plain64, which is default for luks, needs XTS
CONFIG_CRYPTO_XTS=y

# Left off on purpose: only needed by `cryptsetup benchmark` (AF_ALG), which we
# don't expose to users. Uncomment temporarily on a target board only to
# re-measure the pinned LUKS_DATA_PBKDF_* constants.
# CONFIG_CRYPTO_USER_API_SKCIPHER=y
# CONFIG_CRYPTO_USER_API_HASH=y